name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Unit tests + static analysis ─────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go.work's 1.25.0 — that line is the language minimum, and
          # building on it shipped an unpatched standard library that
          # govulncheck rightly failed. Pinned to a minor rather than
          # "stable" because coverage percentages move between Go releases
          # and scripts/coverage-baseline.txt is recorded against this one:
          # bumping it means running `make coverage-update` in the same
          # version.
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"

      - name: Gofmt
        run: make fmt-check

      - name: Vet
        run: make vet

      # The tool version is pinned in the Makefile, so CI and a local run check
      # the same rules.
      - name: Staticcheck
        run: make lint

      - name: Unit tests (race detector, count=3)
        run: make test-race

      # Compares each module against scripts/coverage-baseline.txt and fails on a
      # drop beyond the tolerance. Per module rather than repo-wide: the nine
      # differ a lot in how much is reachable without a live service.
      - name: Coverage
        run: make coverage-check

  # ── Vulnerability scan ───────────────────────────────────────────────────────
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Not go.work's 1.25.0 — that line is the language minimum, and
          # building on it shipped an unpatched standard library that
          # govulncheck rightly failed. Pinned to a minor rather than
          # "stable" because coverage percentages move between Go releases
          # and scripts/coverage-baseline.txt is recorded against this one:
          # bumping it means running `make coverage-update` in the same
          # version.
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"

      # govulncheck exits non-zero only for advisories whose vulnerable symbols
      # this code actually calls. An advisory in a module we merely require, with
      # no call path into it, is reported but does not fail the build — so an
      # unfixable transitive advisory cannot block unrelated PRs. Its own job, so
      # an advisory published between pushes does not hide the test results.
      - name: govulncheck
        run: make vuln

  # ── Integration tests ─────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go.work's 1.25.0 — that line is the language minimum, and
          # building on it shipped an unpatched standard library that
          # govulncheck rightly failed. Pinned to a minor rather than
          # "stable" because coverage percentages move between Go releases
          # and scripts/coverage-baseline.txt is recorded against this one:
          # bumping it means running `make coverage-update` in the same
          # version.
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"

      - name: Integration tests (race detector)
        # make test-integration starts infra via its infra-up prerequisite.
        run: make test-integration

      - name: Stop infrastructure
        if: always()
        run: make infra-down
