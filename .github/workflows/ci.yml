name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Unit tests + static analysis ─────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Gofmt
        run: make fmt-check

      - name: Vet
        run: |
          for mod in $(find . -name go.mod -not -path './.git/*' | xargs -I{} dirname {}); do
            echo "▶ vet: $mod"
            (cd "$mod" && go vet ./...)
          done

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: |
          for mod in $(find . -name go.mod -not -path './.git/*' | xargs -I{} dirname {}); do
            echo "▶ staticcheck: $mod"
            (cd "$mod" && staticcheck ./...)
          done

      - name: Unit tests (race detector, count=3)
        run: make test-race

      # Compares each module against scripts/coverage-baseline.txt and fails on a
      # drop beyond the tolerance. Per module rather than repo-wide: the nine
      # differ a lot in how much is reachable without a live service.
      - name: Coverage
        run: make coverage-check

  # ── Vulnerability scan ───────────────────────────────────────────────────────
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # govulncheck exits non-zero only for advisories whose vulnerable symbols
      # this code actually calls. An advisory in a module we merely require, with
      # no call path into it, is reported but does not fail the build — so an
      # unfixable transitive advisory cannot block unrelated PRs. Its own job, so
      # an advisory published between pushes does not hide the test results.
      - name: govulncheck
        run: make vuln

  # ── Integration tests ─────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - name: Integration tests (race detector)
        # make test-integration starts infra via its infra-up prerequisite.
        run: make test-integration

      - name: Stop infrastructure
        if: always()
        run: make infra-down
